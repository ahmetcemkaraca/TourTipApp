version: '3.8'

services:
  # Firebase Emulator Suite for local development
  firebase-emulators:
    image: node:18-alpine
    container_name: tourtrip-firebase-emulators
    working_dir: /app
    ports:
      - "4000:4000"   # Emulator Suite UI
      - "9099:9099"   # Authentication
      - "8080:8080"   # Cloud Functions
      - "9000:9000"   # Realtime Database
      - "8085:8085"   # Cloud Firestore
      - "9199:9199"   # Cloud Storage
      - "9299:9299"   # Cloud Pub/Sub
    volumes:
      - ./firebase:/app
      - firebase_data:/app/.firebase
    command: >
      sh -c "
        npm install -g firebase-tools &&
        firebase emulators:start --only auth,firestore,functions,storage,database,pubsub --host 0.0.0.0
      "
    environment:
      - FIREBASE_PROJECT_ID=tourtrip-dev
    networks:
      - tourtrip-network

  # Redis for additional caching (optional with Firebase)
  redis-dev:
    image: redis:7-alpine
    container_name: tourtrip-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - tourtrip-network

  # Development proxy for Firebase Functions
  nginx-dev:
    image: nginx:alpine
    container_name: tourtrip-nginx-dev
    ports:
      - "3000:80"
    volumes:
      - ./nginx/firebase-dev.conf:/etc/nginx/nginx.conf
    depends_on:
      - firebase-emulators
    networks:
      - tourtrip-network

volumes:
  firebase_data:
  redis_dev_data:

networks:
  tourtrip-network:
    driver: bridge