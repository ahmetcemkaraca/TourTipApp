version: '3.8'

services:
  # Firebase CLI Tools for live development
  firebase-tools:
    image: node:18-alpine
    container_name: tourtrip-firebase-tools
    working_dir: /app
    volumes:
      - ./firebase:/app
      - firebase_cache:/app/.firebase
    command: >
      sh -c "
        npm install -g firebase-tools &&
        echo 'Firebase CLI ready for live development' &&
        tail -f /dev/null
      "
    environment:
      - FIREBASE_PROJECT_ID=tourtrip-live-dev
    networks:
      - tourtrip-network

  # Redis for caching and session management
  redis-dev:
    image: redis:7-alpine
    container_name: tourtrip-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    networks:
      - tourtrip-network

  # Development monitoring and logging
  monitoring:
    image: nginx:alpine
    container_name: tourtrip-monitoring
    ports:
      - "3000:80"
    volumes:
      - ./nginx/live-dev.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
    networks:
      - tourtrip-network

volumes:
  firebase_cache:
  redis_dev_data:

networks:
  tourtrip-network:
    driver: bridge