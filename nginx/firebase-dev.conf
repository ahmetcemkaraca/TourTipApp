events {
    worker_connections 1024;
}

http {
    upstream firebase_functions {
        server firebase-emulators:8080;
    }

    upstream firebase_auth {
        server firebase-emulators:9099;
    }

    upstream firebase_firestore {
        server firebase-emulators:8085;
    }

    server {
        listen 80;
        server_name localhost;

        # Firebase Cloud Functions
        location /api/ {
            proxy_pass http://firebase_functions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Firebase Auth Emulator
        location /auth/ {
            proxy_pass http://firebase_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Firebase Firestore Emulator
        location /firestore/ {
            proxy_pass http://firebase_firestore;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 "OK - Firebase Development Environment";
            add_header Content-Type text/plain;
        }

        # Default response
        location / {
            return 200 "TourTrip.app Firebase Development Environment";
            add_header Content-Type text/plain;
        }
    }
}