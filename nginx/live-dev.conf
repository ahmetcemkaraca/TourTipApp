events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            return 200 "OK - Live Firebase Development Environment";
            add_header Content-Type text/plain;
        }

        # Firebase project status
        location /firebase-status {
            return 200 "Connected to: tourtrip-live-dev Firebase project";
            add_header Content-Type text/plain;
        }

        # Development dashboard
        location / {
            return 200 "TourTrip.app Live Firebase Development Environment
            
Firebase Project: tourtrip-live-dev
Environment: Live Development
Status: Active

Available endpoints:
- /health - Health check
- /firebase-status - Firebase connection status
            ";
            add_header Content-Type text/plain;
        }
    }
}