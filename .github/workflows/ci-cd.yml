name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  FIREBASE_CLI_VERSION: 'latest'

jobs:
  # Lint and Code Quality Check
  lint:
    runs-on: ubuntu-latest
    name: 🔍 Lint & Code Quality
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🎨 Check Prettier formatting
        run: npx prettier --check .

      - name: 🔒 Audit dependencies
        run: npm audit --audit-level moderate

  # Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    name: 🧪 Unit Tests
    needs: lint
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # Build Application
  build:
    runs-on: ubuntu-latest
    name: 🏗️ Build Application
    needs: [lint, unit-tests]
    
    strategy:
      matrix:
        environment: [development, staging, production]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            NODE_ENV=production npm run build
          elif [ "${{ matrix.environment }}" = "staging" ]; then
            NODE_ENV=staging npm run staging:build
          else
            NODE_ENV=development npm run build
          fi
        env:
          NEXT_PUBLIC_ENVIRONMENT: ${{ matrix.environment }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.environment }}
          path: |
            .next/
            out/
          retention-days: 1

  # Integration Tests with Firebase Emulator
  integration-tests:
    runs-on: ubuntu-latest
    name: 🔗 Integration Tests
    needs: build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔥 Setup Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_CLI_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔥 Start Firebase Emulator
        run: |
          firebase emulators:start --only auth,firestore,functions,storage &
          sleep 30  # Wait for emulators to start
        env:
          FIREBASE_PROJECT_ID: demo-test

      - name: 🌱 Seed test data
        run: npm run emulator:seed

      - name: 🔗 Run integration tests
        run: npm run test:integration
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

      - name: 🛑 Stop Firebase Emulator
        run: firebase emulators:stop

  # End-to-End Tests
  e2e-tests:
    runs-on: ubuntu-latest
    name: 🎭 E2E Tests
    needs: build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔥 Setup Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_CLI_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 📤 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-development

      - name: 🔥 Start Firebase Emulator & Hosting
        run: |
          firebase emulators:start --only auth,firestore,functions,storage,hosting &
          sleep 30  # Wait for emulators to start
        env:
          FIREBASE_PROJECT_ID: demo-test

      - name: 🌱 Seed test data
        run: npm run emulator:seed

      - name: 🎭 Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: 📤 Upload E2E test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: 🛑 Stop Firebase Emulator
        run: firebase emulators:stop

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    name: 🔒 Security Scanning
    needs: build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: npm audit --audit-level high

      - name: 🔍 Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: 🔐 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Staging
    needs: [unit-tests, integration-tests, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔥 Setup Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_CLI_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📤 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-staging

      - name: 🔐 Authenticate to Firebase
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}" | base64 -d > service-account.json
      
      - name: 🚀 Deploy to Firebase Staging
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          npm run staging:deploy
        env:
          FIREBASE_PROJECT_ID: tourtrip-staging
          NODE_ENV: staging

      - name: 🧹 Cleanup service account
        run: rm -f service-account.json

      - name: 🔗 Comment deployment URL
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Staging deployment completed!\n\n📱 **Preview URL:** https://tourtrip-staging.web.app\n🆔 **Deployment ID:** staging-${{ github.run_id }}'
            })

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    name: 🌟 Deploy to Production
    needs: [unit-tests, integration-tests, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔥 Setup Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_CLI_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📤 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-production

      - name: 🔐 Authenticate to Firebase
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}" | base64 -d > service-account.json

      - name: 🌟 Deploy to Firebase Production
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          firebase deploy --project tourtrip-prod --force
        env:
          FIREBASE_PROJECT_ID: tourtrip-prod
          NODE_ENV: production

      - name: 🧹 Cleanup service account
        run: rm -f service-account.json

      - name: 📊 Create deployment record
        run: |
          echo "🎉 Production deployment completed!"
          echo "📱 **Live URL:** https://tourtrip.app"
          echo "🆔 **Deployment ID:** prod-${{ github.run_id }}"
          echo "📝 **Commit:** ${{ github.sha }}"
          echo "👤 **Deployed by:** ${{ github.actor }}"

  # Notification
  notify:
    runs-on: ubuntu-latest
    name: 📢 Notification
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: 📢 Send Slack notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
