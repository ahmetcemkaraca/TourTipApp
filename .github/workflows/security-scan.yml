name: Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package*.json'
      - 'functions/package*.json'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: 🔒 Security Audit
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run npm audit
        run: |
          npm audit --audit-level moderate --json > npm-audit.json || true
          cat npm-audit.json

      - name: 🔍 Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json > snyk-audit.json

      - name: 🔐 TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: 🛡️ CodeQL analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: 🛡️ Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: 📊 Security report
        run: |
          echo "# 🔒 Security Scan Report" >> security-report.md
          echo "**Date:** $(date)" >> security-report.md
          echo "**Commit:** ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          
          echo "## NPM Audit Results" >> security-report.md
          if [ -f npm-audit.json ]; then
            echo "- Vulnerabilities found in dependencies" >> security-report.md
          else
            echo "- ✅ No vulnerabilities found" >> security-report.md
          fi
          
          echo "" >> security-report.md
          echo "## Snyk Scan Results" >> security-report.md
          if [ -f snyk-audit.json ]; then
            echo "- Security issues detected by Snyk" >> security-report.md
          else
            echo "- ✅ No issues found by Snyk" >> security-report.md
          fi

      - name: 📤 Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: |
            security-report.md
            npm-audit.json
            snyk-audit.json
          retention-days: 30

  dependency-review:
    runs-on: ubuntu-latest
    name: 🔍 Dependency Review
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
          allow-ghsas: GHSA-example-1234
          deny-licenses: GPL-3.0, LGPL-3.0

  firebase-security:
    runs-on: ubuntu-latest
    name: 🔥 Firebase Security Rules Test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔥 Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔥 Start Firebase Emulator
        run: |
          firebase emulators:start --only auth,firestore,storage &
          sleep 30
        env:
          FIREBASE_PROJECT_ID: demo-security-test

      - name: 🛡️ Test Firestore Security Rules
        run: |
          # Test unauthorized access
          npm run test -- --testNamePattern="security"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

      - name: 🛑 Stop Firebase Emulator
        run: firebase emulators:stop
