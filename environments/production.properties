# Production Environment Configuration
ENVIRONMENT=production
DEBUG=false

# API Configuration
API_BASE_URL=https://api.tourtrip.app
API_TIMEOUT=30000
API_RETRY_COUNT=3

# Database Configuration
DB_HOST=${PROD_DB_HOST}
DB_PORT=5432
DB_NAME=tourtrip_production
DB_SSL_MODE=require

# Authentication
JWT_SECRET=${PROD_JWT_SECRET}
JWT_EXPIRATION=86400

# External Services
PAYMENT_GATEWAY_URL=https://payment.example.com
PAYMENT_API_KEY=${PROD_PAYMENT_API_KEY}

# Logging
LOG_LEVEL=WARN
LOG_FORMAT=json

# Feature Flags
ENABLE_TAXI_SERVICE=false
ENABLE_LOYALTY_PROGRAM=true
ENABLE_MARKETPLACE=true

# Mobile App Configuration
ANDROID_APP_ID=com.ack.tourtripapp
IOS_BUNDLE_ID=com.ack.tourtripapp

# Monitoring
SENTRY_DSN=${PROD_SENTRY_DSN}
ANALYTICS_KEY=${PROD_ANALYTICS_KEY}

# Security
RATE_LIMIT_ENABLED=true
CORS_ORIGINS=https://tourtrip.app,https://www.tourtrip.app