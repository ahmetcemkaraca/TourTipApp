# Staging Environment Configuration
ENVIRONMENT=staging
DEBUG=false

# Firebase Configuration
FIREBASE_PROJECT_ID=tourtrip-staging
FIREBASE_API_KEY=${STAGING_FIREBASE_API_KEY}
FIREBASE_AUTH_DOMAIN=tourtrip-staging.firebaseapp.com
FIREBASE_DATABASE_URL=https://tourtrip-staging-default-rtdb.firebaseio.com
FIREBASE_STORAGE_BUCKET=tourtrip-staging.appspot.com
FIREBASE_MESSAGING_SENDER_ID=${STAGING_FCM_SENDER_ID}
FIREBASE_APP_ID=${STAGING_FIREBASE_APP_ID}

# Firebase Cloud Functions
FIREBASE_FUNCTIONS_URL=https://us-central1-tourtrip-staging.cloudfunctions.net
FIREBASE_FUNCTIONS_REGION=us-central1

# API Configuration
API_BASE_URL=https://us-central1-tourtrip-staging.cloudfunctions.net/api
API_TIMEOUT=30000
API_RETRY_COUNT=3

# Authentication (Firebase Auth)
FIREBASE_AUTH_ENABLED=true
CUSTOM_TOKEN_ENABLED=false

# External Services
PAYMENT_GATEWAY_URL=https://staging-payment.example.com
PAYMENT_API_KEY=${STAGING_PAYMENT_API_KEY}

# Firebase Analytics & Monitoring
FIREBASE_ANALYTICS_ENABLED=true
FIREBASE_CRASHLYTICS_ENABLED=true
FIREBASE_PERFORMANCE_ENABLED=true

# Logging
LOG_LEVEL=INFO
LOG_FORMAT=json

# Feature Flags
ENABLE_TAXI_SERVICE=false
ENABLE_LOYALTY_PROGRAM=true
ENABLE_MARKETPLACE=true
ENABLE_OFFLINE_MODE=true

# Mobile App Configuration
ANDROID_APP_ID=com.ack.tourtripapp.staging
IOS_BUNDLE_ID=com.ack.tourtripapp.staging

# Firebase Cloud Messaging
FCM_ENABLED=true
FCM_VAPID_KEY=${STAGING_FCM_VAPID_KEY}

# Monitoring
SENTRY_DSN=${STAGING_SENTRY_DSN}
FIREBASE_REMOTE_CONFIG_ENABLED=true