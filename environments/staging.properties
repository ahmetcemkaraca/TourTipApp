# Staging Environment Configuration
ENVIRONMENT=staging
DEBUG=false

# API Configuration
API_BASE_URL=https://staging-api.tourtrip.app
API_TIMEOUT=30000
API_RETRY_COUNT=3

# Database Configuration
DB_HOST=staging-db.tourtrip.app
DB_PORT=5432
DB_NAME=tourtrip_staging
DB_SSL_MODE=require

# Authentication
JWT_SECRET=${STAGING_JWT_SECRET}
JWT_EXPIRATION=86400

# External Services
PAYMENT_GATEWAY_URL=https://staging-payment.example.com
PAYMENT_API_KEY=${STAGING_PAYMENT_API_KEY}

# Logging
LOG_LEVEL=INFO
LOG_FORMAT=json

# Feature Flags
ENABLE_TAXI_SERVICE=false
ENABLE_LOYALTY_PROGRAM=true
ENABLE_MARKETPLACE=true

# Mobile App Configuration
ANDROID_APP_ID=com.ack.tourtripapp.staging
IOS_BUNDLE_ID=com.ack.tourtripapp.staging

# Monitoring
SENTRY_DSN=${STAGING_SENTRY_DSN}
ANALYTICS_KEY=${STAGING_ANALYTICS_KEY}