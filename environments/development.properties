# Development Environment Configuration
ENVIRONMENT=development
DEBUG=true

# API Configuration
API_BASE_URL=https://dev-api.tourtrip.app
API_TIMEOUT=30000
API_RETRY_COUNT=3

# Database Configuration
DB_HOST=localhost
DB_PORT=5432
DB_NAME=tourtrip_dev
DB_SSL_MODE=disable

# Authentication
JWT_SECRET=dev-jwt-secret-key-change-in-production
JWT_EXPIRATION=86400

# External Services
PAYMENT_GATEWAY_URL=https://sandbox-payment.example.com
PAYMENT_API_KEY=dev_payment_key

# Logging
LOG_LEVEL=DEBUG
LOG_FORMAT=json

# Feature Flags
ENABLE_TAXI_SERVICE=false
ENABLE_LOYALTY_PROGRAM=true
ENABLE_MARKETPLACE=true

# Mobile App Configuration
ANDROID_APP_ID=com.ack.tourtripapp.dev
IOS_BUNDLE_ID=com.ack.tourtripapp.dev