# Development Environment Configuration
ENVIRONMENT=development
DEBUG=true

# Firebase Configuration
FIREBASE_PROJECT_ID=tourtrip-dev
FIREBASE_API_KEY=AIzaSyDev_API_Key_Here
FIREBASE_AUTH_DOMAIN=tourtrip-dev.firebaseapp.com
FIREBASE_DATABASE_URL=https://tourtrip-dev-default-rtdb.firebaseio.com
FIREBASE_STORAGE_BUCKET=tourtrip-dev.appspot.com
FIREBASE_MESSAGING_SENDER_ID=123456789012
FIREBASE_APP_ID=1:123456789012:android:dev_app_id_here

# Firebase Cloud Functions
FIREBASE_FUNCTIONS_URL=https://us-central1-tourtrip-dev.cloudfunctions.net
FIREBASE_FUNCTIONS_REGION=us-central1

# API Configuration
API_BASE_URL=https://us-central1-tourtrip-dev.cloudfunctions.net/api
API_TIMEOUT=30000
API_RETRY_COUNT=3

# Authentication (Firebase Auth)
FIREBASE_AUTH_ENABLED=true
CUSTOM_TOKEN_ENABLED=false

# External Services
PAYMENT_GATEWAY_URL=https://sandbox-payment.example.com
PAYMENT_API_KEY=dev_payment_key

# Firebase Analytics
FIREBASE_ANALYTICS_ENABLED=true
FIREBASE_CRASHLYTICS_ENABLED=true

# Logging
LOG_LEVEL=DEBUG
LOG_FORMAT=json

# Feature Flags
ENABLE_TAXI_SERVICE=false
ENABLE_LOYALTY_PROGRAM=true
ENABLE_MARKETPLACE=true
ENABLE_OFFLINE_MODE=true

# Mobile App Configuration
ANDROID_APP_ID=com.ack.tourtripapp.dev
IOS_BUNDLE_ID=com.ack.tourtripapp.dev

# Firebase Cloud Messaging
FCM_ENABLED=true
FCM_VAPID_KEY=dev_vapid_key_here