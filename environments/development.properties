# Live Development Environment Configuration
ENVIRONMENT=live-development
DEBUG=true

# Firebase Configuration (Live Firebase Project)
FIREBASE_PROJECT_ID=tourtrip-live-dev
FIREBASE_API_KEY=${LIVE_DEV_FIREBASE_API_KEY}
FIREBASE_AUTH_DOMAIN=tourtrip-live-dev.firebaseapp.com
FIREBASE_DATABASE_URL=https://tourtrip-live-dev-default-rtdb.firebaseio.com
FIREBASE_STORAGE_BUCKET=tourtrip-live-dev.appspot.com
FIREBASE_MESSAGING_SENDER_ID=${LIVE_DEV_FCM_SENDER_ID}
FIREBASE_APP_ID=${LIVE_DEV_FIREBASE_APP_ID}

# Firebase Cloud Functions (Live)
FIREBASE_FUNCTIONS_URL=https://us-central1-tourtrip-live-dev.cloudfunctions.net
FIREBASE_FUNCTIONS_REGION=us-central1

# API Configuration (Live Firebase Functions)
API_BASE_URL=https://us-central1-tourtrip-live-dev.cloudfunctions.net/api
API_TIMEOUT=30000
API_RETRY_COUNT=3

# Authentication (Live Firebase Auth)
FIREBASE_AUTH_ENABLED=true
FIREBASE_USE_EMULATOR=false
CUSTOM_TOKEN_ENABLED=false

# External Services
PAYMENT_GATEWAY_URL=https://sandbox-payment.example.com
PAYMENT_API_KEY=${LIVE_DEV_PAYMENT_API_KEY}

# Firebase Analytics (Live)
FIREBASE_ANALYTICS_ENABLED=true
FIREBASE_CRASHLYTICS_ENABLED=true
FIREBASE_PERFORMANCE_ENABLED=true

# Logging
LOG_LEVEL=DEBUG
LOG_FORMAT=json

# Feature Flags
ENABLE_TAXI_SERVICE=false
ENABLE_LOYALTY_PROGRAM=true
ENABLE_MARKETPLACE=true
ENABLE_OFFLINE_MODE=true

# Mobile App Configuration
ANDROID_APP_ID=com.ack.tourtripapp.livedev
IOS_BUNDLE_ID=com.ack.tourtripapp.livedev

# Firebase Cloud Messaging (Live)
FCM_ENABLED=true
FCM_VAPID_KEY=${LIVE_DEV_FCM_VAPID_KEY}

# Live Development Settings
FIREBASE_REMOTE_CONFIG_ENABLED=true
FIREBASE_DYNAMIC_LINKS_ENABLED=true